<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#17110e" />
    <title>FEAST — Taste That Hits Different</title>
    <meta name="description" content="Order burgers, pizza, wraps, wings and more from FEAST. Fast delivery and live order tracking." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/css/app.css" />
    <script>try { var t = localStorage.getItem('feast-theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch (e) {}</script>
  </head>
  <body>
    <div id="app"><div class="spinner" style="margin-top:30vh"></div></div>
    <noscript>FEAST needs JavaScript enabled to take your order.</noscript>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
